<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#074884"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MAX Load 2.0</title>
<link rel="manifest" href="./manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
<style>
:root{--blue:#074884;--blue2:#0b65b8;--ink:#122033;--muted:#718096;--line:#dce5ef;--bg:#f4f7fb;--good:#159447;--warn:#d98100;--bad:#cc3030;--card:#fff;--shadow:0 8px 28px rgba(24,48,76,.08)}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif;padding-bottom:96px} button,input,select{font:inherit}
.app{max-width:1440px;margin:auto;padding:18px}
.header{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#063d73,#0a5da8);color:white;border-radius:24px;padding:18px 22px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:14px} .brand img{width:62px;height:62px;border-radius:16px;box-shadow:0 8px 20px #0003} .brand h1{margin:0;font-size:30px;letter-spacing:.3px} .brand p{margin:4px 0 0;color:#dbeeff}
.reset{border:1px solid #ffffff66;background:#ffffff18;color:white;border-radius:12px;padding:10px 14px;cursor:pointer}
.section{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-top:16px;padding:18px;box-shadow:var(--shadow)}
.section-title{font-size:22px;font-weight:800;margin:0 0 14px}
.truck-strip{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:12px}
.truck-card{border:2px solid transparent;background:white;border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 3px 12px rgba(12,44,76,.08);transition:.18s;position:relative}
.truck-card:hover{transform:translateY(-2px)} .truck-card.active{border-color:var(--blue2);box-shadow:0 8px 22px rgba(11,101,184,.18)}
.truck-card img{width:100%;height:104px;object-fit:cover;display:block;filter:grayscale(.1)} .truck-card.active img{filter:none}
.truck-info{padding:10px 12px} .plate{font-size:17px;font-weight:800;direction:ltr;text-align:right} .meta{font-size:13px;color:var(--muted);margin-top:3px} .cap{font-weight:800;color:var(--blue2);margin-top:6px}
.check{display:none;position:absolute;left:9px;top:9px;background:var(--blue2);color:white;border-radius:50%;width:26px;height:26px;place-items:center;font-weight:bold} .active .check{display:grid}
.main-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;margin-top:16px;align-items:start}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.compact-card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;min-height:142px}
.compact-card h3{margin:0 0 12px;font-size:19px} .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden} .seg button{border:0;background:white;padding:12px;cursor:pointer} .seg button.active{background:var(--blue2);color:white;font-weight:700}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;border:1px solid var(--line);border-radius:12px;overflow:hidden;align-items:center} .stepper button{border:0;background:#f5f8fc;color:var(--blue2);font-size:24px;padding:8px;cursor:pointer} .stepper strong{text-align:center;font-size:22px}
.small-note{font-size:13px;color:var(--muted);margin-top:10px}
.load-table{margin-top:14px} .table-head,.load-row{display:grid;grid-template-columns:1.5fr .8fr 1fr .8fr 44px;gap:10px;align-items:center} .table-head{background:var(--blue);color:white;border-radius:12px;padding:11px 12px;font-weight:700} .load-row{padding:10px 4px;border-bottom:1px solid #e8eef5}
select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white} .qty{display:grid;grid-template-columns:36px 1fr 36px;border:1px solid var(--line);border-radius:10px;overflow:hidden} .qty button{border:0;background:#f4f7fb;color:var(--blue2);font-size:20px} .qty input{width:100%;border:0;text-align:center;min-width:0}
.row-weight{font-weight:800;text-align:center} .trash{border:0;background:#fff1f1;color:var(--bad);width:38px;height:38px;border-radius:10px;font-size:18px}
.add-row{width:100%;margin-top:12px;border:1.5px dashed #7eb0df;background:#f7fbff;color:var(--blue2);border-radius:12px;padding:12px;font-weight:800;cursor:pointer}
.summary{position:sticky;top:14px;background:white;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)} .sum-title{font-size:22px;font-weight:800} .vehicle-chip{margin-top:10px;background:#eef6ff;border-radius:12px;padding:10px;font-weight:700}
.stats{margin-top:14px} .stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf1f5} .stat strong{font-size:18px}
.ring{width:170px;height:170px;margin:18px auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--good) 0deg,#e7edf3 0deg);position:relative} .ring:before{content:"";position:absolute;inset:17px;border-radius:50%;background:white} .ring-content{position:relative;text-align:center} .ring-content b{font-size:40px} .ring-content span{display:block;color:var(--muted)}
.status{border-radius:14px;padding:13px;text-align:center;font-size:20px;font-weight:800;background:#eaf8ef;color:var(--good)}
.ramp-note{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.actions{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px}
.actions button{border:0;border-radius:13px;padding:14px 26px;font-weight:800;font-size:18px;cursor:pointer;min-width:180px} .pdf{background:var(--blue2);color:white} .wa{background:#18a84a;color:white}
.mobile-summary{display:none}
@media(max-width:1000px){.truck-strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px} .truck-card{min-width:220px;scroll-snap-align:start} .main-grid{grid-template-columns:1fr} .summary{position:static}}
@media(max-width:640px){body{padding-bottom:88px} .app{padding:10px} .header{border-radius:18px;padding:12px 14px} .brand img{width:48px;height:48px} .brand h1{font-size:24px} .brand p{font-size:13px} .reset{padding:8px 10px;font-size:13px} .section{padding:14px;border-radius:18px} .section-title{font-size:20px} .truck-card{min-width:190px} .truck-card img{height:94px} .controls{grid-template-columns:1fr} .compact-card{min-height:auto} .table-head{display:none} .load-row{grid-template-columns:1fr 1fr;gap:8px;padding:12px 0} .load-row .item-select{grid-column:1/3} .row-weight{text-align:right;background:#f5f8fb;border-radius:10px;padding:10px} .trash{justify-self:end} .actions{gap:8px} .actions button{min-width:0;flex:1;padding:13px 8px;font-size:16px} .ring{width:150px;height:150px}}
@media print{body{background:white;padding:0} .header,.actions,.section,.controls,.load-table{display:none!important} .summary{display:block;box-shadow:none;border:0;position:static;max-width:650px;margin:20px auto} .print-report{display:block!important}}
.print-report{display:none}

.brand-title{display:flex;align-items:center;gap:10px}.version-chip{font-size:12px;font-weight:800;background:#ffb400;color:#082f57;padding:4px 8px;border-radius:999px;letter-spacing:.4px}.truck-card img{background:#eef4fb}.truck-card.active:after{content:"נבחרה";position:absolute;right:10px;top:10px;background:#074884;color:#fff;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.truck-card.active .check{display:none}.brand img{object-fit:cover}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="brand"><img src="./brand-icon.png" alt="MAX Load 2.0"><div><div class="brand-title"><h1>MAX Load</h1><span class="version-chip">2.0</span></div><p>מחשבון משקל העמסה למשאיות</p></div></div><button class="reset" onclick="resetAll()">נקה הכול</button></header>
<section class="section"><h2 class="section-title">בחירת משאית</h2><div id="truckStrip" class="truck-strip"></div></section>
<div class="main-grid"><main>
<section class="section"><div class="controls">
<div class="compact-card"><h3>עגלה</h3><div class="seg"><button id="cartNo" class="active" onclick="setCart(false)">אין</button><button id="cartYes" onclick="setCart(true)">יש</button></div><div class="small-note">משקל קבוע: 300 ק״ג</div></div>
<div class="compact-card"><h3>כלוב בלגי</h3><div class="stepper"><button onclick="changeCage('belgian',-1)">−</button><strong id="belgianCount">0</strong><button onclick="changeCage('belgian',1)">+</button></div><div class="small-note">160 ק״ג ליחידה</div></div>
<div class="compact-card"><h3>כלוב קטן</h3><div class="stepper"><button onclick="changeCage('small',-1)">−</button><strong id="smallCount">0</strong><button onclick="changeCage('small',1)">+</button></div><div class="small-note">80 ק״ג ליחידה</div></div>
</div>
<div class="load-table"><div class="table-head"><div>סוג פריט</div><div>מצב</div><div>כמות</div><div>משקל</div><div></div></div><div id="rows"></div><button class="add-row" onclick="addRow()">＋ הוסף שורת פריט</button></div>
</section></main>
<aside class="summary"><div class="sum-title">סיכום העמסה</div><div id="vehicleChip" class="vehicle-chip">בחר משאית</div><div class="stats"><div class="stat"><span>כושר העמסה</span><strong id="cap">—</strong></div><div class="stat"><span>משקל בפועל</span><strong id="used">0 ק״ג</strong></div><div class="stat"><span>נותר להעמסה</span><strong id="remain">—</strong></div></div><div id="ring" class="ring"><div class="ring-content"><b id="pct">0%</b><span>ניצול</span></div></div><div id="status" class="status">בחר משאית</div><div id="ramp" class="ramp-note"></div></aside>
</div>
</div>
<div class="actions"><button class="pdf" onclick="printReport()">הפק דוח PDF</button><button class="wa" onclick="shareReport()">WhatsApp</button></div>
<div id="printReport" class="print-report"></div>
<script>
const TRUCKS=[{"id":"v1","model":"IVECO","plate":"80-430-203","gross":7200,"tare":3912,"capacity":3288,"type":"רכב מדיקל","ramp":1500,"img":"./iveco.jpg"},{"id":"v2","model":"IVECO","plate":"11-111-1","gross":7200,"tare":3912,"capacity":3288,"type":"רכב מדיקל","ramp":1500,"img":"./iveco.jpg"},{"id":"v3","model":"DAF","plate":"11-112-39","gross":12000,"tare":6169,"capacity":5831,"type":"רכב תעשייתי","ramp":2000,"img":"./daf.jpg"},{"id":"v4","model":"DAF","plate":"66-032-901","gross":12000,"tare":6030,"capacity":5970,"type":"רכב תעשייתי","ramp":2000,"img":"./daf.jpg"},{"id":"v5","model":"DAF","plate":"65-941-901","gross":12000,"tare":6250,"capacity":5750,"type":"רכב תעשייתי","ramp":2000,"img":"./daf.jpg"},{"id":"v6","model":"DAF","plate":"10-983-39","gross":12000,"tare":5880,"capacity":6120,"type":"רכב תעשייתי","ramp":2000,"img":"./daf.jpg"}];
const ITEMS=[{"name": "גליל גז", "empty": 54, "full": 64}, {"name": "גליל נוזל", "empty": 54, "full": 80}, {"name": "גליל קטן", "empty": 3, "full": 3.5}, {"name": "דיואר", "empty": 150, "full": 420}, {"name": "סוללת 6", "empty": 420, "full": 480}, {"name": "סוללת 12", "empty": 680, "full": 800}, {"name": "סוללת 24", "empty": 1700, "full": 1940}, {"name": "סוללת 36", "empty": 2020, "full": 2380}, {"name": "סוללת פדח 4", "empty": 372, "full": 480}];
let state={truck:null,cart:false,belgian:0,small:0,rows:[]};
const fmt=n=>new Intl.NumberFormat('he-IL',{maximumFractionDigits:1}).format(n)+' ק״ג';
function init(){renderTrucks();addRow();calc();}
function renderTrucks(){const s=document.getElementById('truckStrip');s.innerHTML='';TRUCKS.forEach(t=>{const el=document.createElement('button');el.className='truck-card'+(state.truck?.id===t.id?' active':'');el.innerHTML=`<span class="check">✓</span><img src="${t.img}" alt="${t.model}"><div class="truck-info"><div class="plate">${t.plate}</div><div class="meta">${t.model} · ${t.type}</div><div class="cap">כושר העמסה: ${fmt(t.capacity)}</div></div>`;el.onclick=()=>{state.truck=t;renderTrucks();calc();};s.appendChild(el)})}
function setCart(v){state.cart=v;cartNo.classList.toggle('active',!v);cartYes.classList.toggle('active',v);calc();}
function changeCage(k,d){state[k]=Math.max(0,state[k]+d);document.getElementById(k+'Count').textContent=state[k];calc();}
function addRow(){state.rows.push({item:0,status:'full',qty:1});renderRows();calc();}
function renderRows(){const box=document.getElementById('rows');box.innerHTML='';state.rows.forEach((r,i)=>{const el=document.createElement('div');el.className='load-row';el.innerHTML=`<select class="item-select" onchange="updateRow(${i},'item',this.value)">${ITEMS.map((x,j)=>`<option value="${j}" ${j==r.item?'selected':''}>${x.name}</option>`).join('')}</select><select onchange="updateRow(${i},'status',this.value)"><option value="full" ${r.status==='full'?'selected':''}>מלא</option><option value="empty" ${r.status==='empty'?'selected':''}>ריק</option></select><div class="qty"><button onclick="qty(${i},-1)">−</button><input value="${r.qty}" inputmode="numeric" onchange="setQty(${i},this.value)"><button onclick="qty(${i},1)">+</button></div><div class="row-weight" id="rw${i}">0 ק״ג</div><button class="trash" onclick="removeRow(${i})">🗑</button>`;box.appendChild(el)})}
function updateRow(i,k,v){state.rows[i][k]=k==='item'?Number(v):v;calc();}
function qty(i,d){state.rows[i].qty=Math.max(0,state.rows[i].qty+d);renderRows();calc();}
function setQty(i,v){state.rows[i].qty=Math.max(0,Number(v)||0);renderRows();calc();}
function removeRow(i){state.rows.splice(i,1);if(!state.rows.length)addRow();else{renderRows();calc();}}
function totals(){let fixed=(state.cart?300:0)+state.belgian*160+state.small*80;let dynamic=0;state.rows.forEach((r,i)=>{let it=ITEMS[r.item];let w=(r.status==='full'?it.full:it.empty)*r.qty;dynamic+=w;let e=document.getElementById('rw'+i);if(e)e.textContent=fmt(w)});return fixed+dynamic}
function calc(){const usedN=totals();used.textContent=fmt(usedN);if(!state.truck){cap.textContent='—';remain.textContent='—';pct.textContent='0%';status.textContent='בחר משאית';status.style='';ring.style.background='conic-gradient(#159447 0deg,#e7edf3 0deg)';vehicleChip.textContent='בחר משאית';ramp.textContent='';return} const c=state.truck.capacity,p=usedN/c*100,rem=c-usedN;cap.textContent=fmt(c);remain.textContent=fmt(rem);remain.style.color=rem<0?'var(--bad)':'var(--good)';pct.textContent=Math.round(p)+'%';vehicleChip.textContent=`${state.truck.model} · ${state.truck.plate}`;ramp.textContent=`מגבלת רמפה לפי הנתונים: ${fmt(state.truck.ramp)}`;let color=p>100?'var(--bad)':p>=90?'var(--warn)':'var(--good)';ring.style.background=`conic-gradient(${color} ${Math.min(p,100)*3.6}deg,#e7edf3 0deg)`;status.style.background=p>100?'#fdecec':p>=90?'#fff4df':'#eaf8ef';status.style.color=color;status.textContent=p>100?`חריגה של ${fmt(-rem)}`:p>=90?'קרוב למגבלה':'תקין להעמסה'}
function reportHtml(){const t=state.truck;const now=new Date().toLocaleString('he-IL');const rows=state.rows.map(r=>{const it=ITEMS[r.item],w=(r.status==='full'?it.full:it.empty)*r.qty;return `<tr><td>${it.name}</td><td>${r.status==='full'?'מלא':'ריק'}</td><td>${r.qty}</td><td>${fmt(w)}</td></tr>`}).join('');return `<div style="direction:rtl;font-family:Arial;padding:28px"><div style="display:flex;align-items:center;gap:15px;border-bottom:3px solid #074884;padding-bottom:15px"><img src="./brand-icon.png" style="width:70px;border-radius:16px"><div><h1 style="margin:0;color:#074884">MAX Load</h1><div>דוח העמסת משאית</div></div></div><p><b>תאריך ושעה:</b> ${now}</p><p><b>משאית:</b> ${t?t.model+' · '+t.plate:'לא נבחרה'}</p><p><b>כושר העמסה:</b> ${t?fmt(t.capacity):'—'}</p><table style="width:100%;border-collapse:collapse;margin-top:20px"><thead><tr style="background:#074884;color:#fff"><th style="padding:10px">פריט</th><th>מצב</th><th>כמות</th><th>משקל</th></tr></thead><tbody><tr><td style="padding:8px;border-bottom:1px solid #ddd">עגלה</td><td colspan="2" style="border-bottom:1px solid #ddd">${state.cart?'יש':'אין'}</td><td style="border-bottom:1px solid #ddd">${state.cart?fmt(300):fmt(0)}</td></tr><tr><td style="padding:8px;border-bottom:1px solid #ddd">כלוב בלגי</td><td colspan="2" style="border-bottom:1px solid #ddd">${state.belgian}</td><td style="border-bottom:1px solid #ddd">${fmt(state.belgian*160)}</td></tr><tr><td style="padding:8px;border-bottom:1px solid #ddd">כלוב קטן</td><td colspan="2" style="border-bottom:1px solid #ddd">${state.small}</td><td style="border-bottom:1px solid #ddd">${fmt(state.small*80)}</td></tr>${rows}</tbody></table><div style="margin-top:24px;border:2px solid #074884;border-radius:16px;padding:18px;font-size:20px"><div><b>סה״כ משקל:</b> ${fmt(totals())}</div><div><b>יתרה:</b> ${t?fmt(t.capacity-totals()):'—'}</div></div></div>`}
function printReport(){document.getElementById('printReport').innerHTML=reportHtml();setTimeout(()=>window.print(),80)}
async function shareReport(){const text=`MAX Load%0Aמשאית: ${state.truck?state.truck.model+' '+state.truck.plate:'לא נבחרה'}%0Aמשקל בפועל: ${fmt(totals())}%0Aיתרה: ${state.truck?fmt(state.truck.capacity-totals()):'—'}`;window.open('https://wa.me/?text='+text,'_blank')}
function resetAll(){state={truck:null,cart:false,belgian:0,small:0,rows:[]};cartNo.classList.add('active');cartYes.classList.remove('active');belgianCount.textContent='0';smallCount.textContent='0';addRow();renderTrucks();calc()}
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
init();
</script>
</body></html>
